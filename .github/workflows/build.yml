name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The build declares a Java 17 toolchain, so Gradle compiles and tests against 17
        # regardless of the launching JDK. Running the launcher on a newer LTS as well catches
        # regressions that would otherwise only surface for users on a current JDK.
        java: [ '17', '21' ]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.14.3'

    - name: Build with Gradle
      run: gradle build

    - name: Upload JAR
      if: matrix.os == 'ubuntu-latest' && matrix.java == '17'
      uses: actions/upload-artifact@v4
      with:
        name: qjs4j-jar
        path: build/libs/*.jar

  coverage:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.14.3'

    - name: Measure coverage
      run: gradle jacocoTestReport

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: build/reports/jacoco/test/

  test262:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout qjs4j
      uses: actions/checkout@v4
      with:
        path: qjs4j

    # The Gradle tasks resolve the suite at ../test262 relative to the project directory.
    - name: Checkout test262
      uses: actions/checkout@v4
      with:
        repository: tc39/test262
        path: test262

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.14.3'

    - name: Run Test262 (quick subset)
      working-directory: qjs4j
      run: gradle test262Quick | tee ../test262-quick.log

    - name: Upload Test262 report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test262-quick-log
        path: test262-quick.log
