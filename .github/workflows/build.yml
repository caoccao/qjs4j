name: Build

# One run per commit.
#
# This used to trigger on a push to any branch *and* on pull requests. For a branch in this
# repository — which is every branch anyone with write access works on — both fire for the same
# commit, so every push to a proposed branch built the whole matrix twice: fourteen jobs where
# seven were asked for, two conformance runs of the same suite, and two identical results to read.
#
# The push trigger was written that way so that a branch nobody has proposed still gets built. That
# is worth having, but not at the price of doubling every build that matters, and the pull_request
# trigger is the better of the two anyway: it builds the merge of the branch with its base, which is
# the state that will exist after merging, and it covers pull requests from forks, which a push
# trigger in this repository never sees at all. So pushes build main, pull requests build everything
# proposed into it, and a branch that wants CI before it is ready asks for it by being opened as a
# draft pull request.
on:
  push:
    branches: [ origin ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ origin ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

# And one run per commit *at a time*: pushing again to an open pull request abandons the build of the
# commit it just replaced, whose result nobody will read. Pushes to main are never cancelled, because
# every commit on main is a state this project claims is good and needs its own answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The build declares a Java 17 toolchain, so Gradle always compiles against 17. The tests
        # run on the matrix JDK via -PtestJavaVersion, so this matrix is genuine runtime coverage
        # of the engine on both LTS releases, not just proof that Gradle can be launched by them.
        java: [ '17', '21' ]
    # Keep the existing check names while investigating stalls on Windows Server 2025.
    runs-on: ${{ matrix.os == 'windows-latest' && 'windows-2022' || matrix.os }}
    # Successful builds take 4–6 minutes. Bound stalls so a failed runner cannot
    # hold the main-branch concurrency group for the default six-hour timeout.
    timeout-minutes: 20

    steps:
    # Configure Git before checkout so Windows preserves the LF endings required by Spotless.
    - name: Enforce LF line endings
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic
        gradle-version: '9.4.1'

    - name: Check Java formatting
      run: gradle spotlessCheck

    - name: Build with Gradle
      if: runner.os != 'Windows' || matrix.java != '21'
      # Coverage reporting and verification run in the dedicated coverage job.
      run: gradle build -x jacocoTestReport -x jacocoTestCoverageVerification -PtestJavaVersion=${{ matrix.java }} --info --console=plain

    - name: Build with Gradle (Windows JDK 21 diagnostics)
      if: runner.os == 'Windows' && matrix.java == '21'
      shell: pwsh
      run: |
        $diagnostics = Join-Path $PWD 'build/ci-diagnostics'
        New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
        $build = Start-Process -FilePath $env:ComSpec -ArgumentList @(
          '/d', '/s', '/c',
          '"gradle build -x jacocoTestReport -x jacocoTestCoverageVerification -PtestJavaVersion=21 --info --console=plain"'
        ) -RedirectStandardOutput "$diagnostics/gradle-stdout.log" `
          -RedirectStandardError "$diagnostics/gradle-stderr.log" -PassThru
        $null = $build.Handle
        # Keep live-console traffic small and retain the full output as an artifact.
        if (-not $build.WaitForExit(8 * 60 * 1000)) {
          Write-Host 'Build exceeded eight minutes; collecting JVM thread dumps.'
          Get-Process java -ErrorAction SilentlyContinue | ForEach-Object {
            $javaProcessId = $_.Id
            try {
              $dump = Start-Process -FilePath "$env:JAVA_HOME/bin/jcmd.exe" `
                -ArgumentList @($javaProcessId, 'Thread.print', '-l') `
                -RedirectStandardOutput "$diagnostics/threads-$javaProcessId.log" `
                -RedirectStandardError "$diagnostics/threads-$javaProcessId.err" -PassThru
              if (-not $dump.WaitForExit(15000)) {
                Stop-Process -Id $dump.Id -Force -ErrorAction SilentlyContinue
              }
            } catch {
              $_ | Out-String | Add-Content "$diagnostics/thread-dump-errors.log"
            }
          }
          & taskkill /PID $build.Id /T /F
          Get-Content "$diagnostics/gradle-stdout.log" -Tail 80
          Get-Content "$diagnostics/gradle-stderr.log" -Tail 80
          exit 1
        }
        $build.WaitForExit()
        Get-Content "$diagnostics/gradle-stdout.log" -Tail 80
        Get-Content "$diagnostics/gradle-stderr.log" -Tail 80
        $exitCode = $build.ExitCode
        if ($null -eq $exitCode) {
          throw 'Gradle completed without an available exit code.'
        }
        exit $exitCode

    - name: Run slow regression tests
      run: gradle slowRegressionTest -PtestJavaVersion=${{ matrix.java }} --info --console=plain

    - name: Upload build diagnostics
      if: failure() || cancelled() || (runner.os == 'Windows' && matrix.java == '21')
      uses: actions/upload-artifact@v7
      with:
        name: build-diagnostics-${{ matrix.os }}-jdk${{ matrix.java }}
        path: |
          build/reports/tests/
          build/test-results/
          build/ci-diagnostics/
          hs_err_pid*.log
        if-no-files-found: ignore

    - name: Upload JAR
      if: matrix.os == 'ubuntu-latest' && matrix.java == '17'
      uses: actions/upload-artifact@v7
      with:
        name: qjs4j-jar
        path: build/libs/*.jar

  coverage:
    runs-on: ubuntu-latest
    steps:
    - name: Enforce LF line endings
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic
        gradle-version: '9.4.1'

    - name: Check Java formatting
      run: gradle spotlessCheck

    # Verification, not just a report: an uploaded artifact is observational and cannot fail a
    # build, so coverage could regress indefinitely without anything noticing.
    - name: Measure and verify coverage
      run: gradle jacocoTestReport jacocoTestCoverageVerification

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: jacoco-report
        path: build/reports/jacoco/test/

  test262:
    runs-on: ubuntu-latest
    # The suite reads the host's default time zone, so without pinning one the result depends on
    # what the runner happens to be set to. UTC rather than the runner's own Etc/UTC: those are the
    # same instant but not the same identifier, and the pinned harness's
    # isCanonicalizedStructurallyValidTimeZoneName still applies the pre-canonical-tz rule that
    # rejects "Etc/UTC" — while canonicalize-utc-timezone.js, in the same suite, asserts the engine
    # must preserve it. The engine follows the newer rule and is right to; only the harness is
    # behind, and only on a host whose own zone is spelled that way.
    env:
      TZ: UTC
    steps:
    - name: Enforce LF line endings
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - name: Checkout qjs4j
      uses: actions/checkout@v7
      with:
        path: qjs4j

    # The Gradle tasks resolve the suite at ../test262 relative to the project directory.
    #
    # Pinned, because a conformance gate that follows a moving suite is not a gate. Unpinned, this
    # tracked the tip of tc39/test262, so upstream adding tests for features the engine has not
    # implemented turned the job red without a line of this repository changing — which is what
    # happened here, and it fails identically on every branch and on main. Bumping the pin is then
    # a deliberate, reviewable act that says which new tests are being taken on.
    - name: Checkout test262
      uses: actions/checkout@v7
      with:
        repository: tc39/test262
        ref: 5c8206929d81b2d3d727ca6aac56c18358c8d790
        path: test262

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic
        gradle-version: '9.4.1'

    - name: Check Java formatting
      working-directory: qjs4j
      run: gradle spotlessCheck

    # pipefail, or the step reports tee's exit status and stays green while Gradle fails: a
    # conformance gate that cannot fail is not a gate.
    - name: Run Test262 (quick subset)
      working-directory: qjs4j
      shell: bash
      run: |
        set -o pipefail
        gradle test262Quick | tee ../test262-quick.log

    - name: Upload Test262 report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test262-quick-log
        path: test262-quick.log
